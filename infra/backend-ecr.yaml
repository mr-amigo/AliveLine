AWSTemplateFormatVersion: "2010-09-09"
Description: AliveLine - ECR repository for the backend Lambda image (deployed before the backend stack).

Parameters:
  ProjectName:
    Type: String
    Default: aliveline

Resources:
  BackendRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub ${ProjectName}-backend
      ImageTagMutability: MUTABLE
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      # Lets Lambda functions of this account pull the image.
      RepositoryPolicyText:
        Version: "2012-10-17"
        Statement:
          - Sid: LambdaPull
            Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer]
            Condition:
              StringLike:
                aws:sourceArn: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:*
      # Stay inside the 500 MB free storage: keep only the newest images.
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [{
              "rulePriority": 1,
              "description": "Keep the last 5 images",
              "selection": { "tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 5 },
              "action": { "type": "expire" }
            }]
          }
      Tags:
        - { Key: PROJECT_NAME, Value: !Ref ProjectName }

Outputs:
  RepositoryUri:
    Value: !GetAtt BackendRepository.RepositoryUri
