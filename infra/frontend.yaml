AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  AliveLine - one CloudFront distribution (HTTPS on *.cloudfront.net): the SPA from a private S3 bucket,
  and /api/* forwarded to the backend Lambda function URL. Same origin for both, so the httpOnly session
  cookie works without CORS.

Parameters:
  ProjectName:
    Type: String
    Default: aliveline
  ApiDomain:
    Type: String
    Description: Host of the backend function URL (output ApiDomain of the backend stack), e.g. abc.lambda-url.us-east-1.on.aws.
  AiDomain:
    Type: String
    Default: ""
    Description: Host of the AI function URL (ai stack output AiDomain). Empty → /api/ai/* goes to the backend.
  PricingPlan:
    Type: String
    Default: FREE
    AllowedValues: [FREE, PAY_AS_YOU_GO]
    Description: >-
      FREE subscribes the distribution to the CloudFront flat-rate Free plan ($0/month, needs a WAF web ACL;
      not available to accounts on the AWS Free Tier). PAY_AS_YOU_GO skips both.
  RateLimitPerIp:
    Type: Number
    Default: 2000
    MinValue: 10
    Description: Requests per IP per 5 minutes before the WAF blocks it (Free plan only).

Conditions:
  UseFreePlan: !Equals [!Ref PricingPlan, FREE]
  HasAi: !Not [!Equals [!Ref AiDomain, ""]]

Mappings:
  CloudFront:
    Managed:
      CachingOptimized: 658327ea-f89d-4fab-a63d-7e88639e58f6
      CachingDisabled: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
      # Forwards cookies, query strings and headers, but not Host (a function URL rejects foreign hosts).
      AllViewerExceptHostHeader: b689b0a8-53d0-40ab-baf2-68738e2966ac

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      Tags:
        - { Key: PROJECT_NAME, Value: !Ref ProjectName }

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${ProjectName}-site-${AWS::StackName}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebAcl:
    Type: AWS::WAFv2::WebACL
    Condition: UseFreePlan
    Properties:
      Name: !Sub ${ProjectName}-${AWS::StackName}
      Scope: CLOUDFRONT
      DefaultAction: { Allow: {} }
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub ${ProjectName}-frontend
      Rules:
        - Name: rate-limit-per-ip
          Priority: 0
          Action: { Block: {} }
          Statement:
            RateBasedStatement:
              Limit: !Ref RateLimitPerIp
              EvaluationWindowSec: 300
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: rate-limit-per-ip
      Tags:
        - { Key: PROJECT_NAME, Value: !Ref ProjectName }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub ${ProjectName} site + API
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_All
        WebACLId: !If [UseFreePlan, !GetAtt WebAcl.Arn, !Ref AWS::NoValue]
        DefaultRootObject: index.html
        ViewerCertificate: { CloudFrontDefaultCertificate: true }
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
          - Id: api
            DomainName: !Ref ApiDomain
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 30
          - !If
            - HasAi
            - Id: ai
              DomainName: !Ref AiDomain
              CustomOriginConfig:
                OriginProtocolPolicy: https-only
                OriginSSLProtocols: [TLSv1.2]
                OriginReadTimeout: 30
            - !Ref AWS::NoValue
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !FindInMap [CloudFront, Managed, CachingOptimized]
        # Order matters: the more specific /api/ai/* must come before /api/*.
        CacheBehaviors:
          - !If
            - HasAi
            - PathPattern: /api/ai/*
              TargetOriginId: ai
              ViewerProtocolPolicy: https-only
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
              CachedMethods: [GET, HEAD]
              Compress: true
              CachePolicyId: !FindInMap [CloudFront, Managed, CachingDisabled]
              OriginRequestPolicyId: !FindInMap [CloudFront, Managed, AllViewerExceptHostHeader]
            - !Ref AWS::NoValue
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !FindInMap [CloudFront, Managed, CachingDisabled]
            OriginRequestPolicyId: !FindInMap [CloudFront, Managed, AllViewerExceptHostHeader]
        # SPA fallback: S3 answers 403 for unknown keys (no ListBucket). Only 403 is mapped, so real
        # 404s from the API reach the client; the API must not use 403.
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 0 }
      Tags:
        - { Key: PROJECT_NAME, Value: !Ref ProjectName }

  # $0/month flat-rate plan; referencing both resources makes CloudFormation create it last and delete it first.
  FreePlanSubscription:
    Type: AWS::PricingPlanManager::Subscription
    Condition: UseFreePlan
    Properties:
      PlanFamily: CloudFront
      PlanTier: FREE
      UsageLevel: DEFAULT
      ResourceArns:
        - !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}
        - !GetAtt WebAcl.Arn

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}

Outputs:
  SiteUrl:
    Value: !Sub https://${Distribution.DomainName}
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
