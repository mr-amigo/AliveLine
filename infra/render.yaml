# Render Blueprint. When creating the Blueprint, set "Blueprint Path" to infra/render.yaml.
services:
  - type: web
    name: aliveline
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./infra/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENV
        value: prod
      - key: COOKIE_SECURE
        value: "true"
      - key: APP_TZ
        value: Europe/Kyiv
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false # Neon connection string, set in the dashboard
      - key: ANTHROPIC_API_KEY
        sync: false # optional; heuristic estimates without it
